<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <main>
        <section>
            <form action="" method="get">
                <fieldset> 
                    <legend>DADOS PESSOAIS</legend>
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="userName" required>
                    <br>
                    <label for="age">Idade</label>
                    <input type="number" id="age" name="userAge" min="12" max="100" required>
                    <br>
                    <label for="date">Data de Nascimento</label>
                    <input type="date" id="date" name="birthDate">,
                    <br>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="userEmail">
                    <br>
                    <label for="phoneNumber">Telefone</label>
                    <input type="tel" id="phoneNumber" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD+ número sem espaços ou hífen">
                    <br>
                    <label for="image">Email</label>
                    <input type="file" id="image" accept="image-*"  name="userImage">
                    <br>
                </fieldset>    
                <fieldset> 
                    <legend>PERFIL</legend>   
                    <p>Gênero</p>                 
                    <input type="radio" id="fem" name="userGender" value="Feminino">
                    <label for="fem">Feminino</label>

                    <input type="radio" id="masc" name="userGender" value="Masculino">
                    <label for="masc">Masculino</label>

                    <input type="radio"id="notinfermed" name="userGender" value="notInformed">
                    <label for="notinfermed">Prefiro não informar</label>
                    <br>

                    <label for="maritalStatus">Estado Civil</label>
                    <select name="usermaritalStatus" id="maritalStatus">
                        <option value="notInformed">Selecione...</option>
                        <option value="solteiro">Solteiro</option>
                        <option value="casado">Casado</option>
                        <option value="divorciado">Divorciado</option>
                        <option value="uniaoEstavel">União Estável</option>
                    </select>
                    <br>

                    <label for="state">Estado</label>
                    <select name="userState" id="state">
                        <option value="notInformed">Selecione...</option>
                        <option value="acre">Acre (AC)</option>
                        <option value="alagoas">Alagoas (AL)</option>
                        <option value="amapa">Amapá (AP)</option>
                        <option value="amazonas">Amazonas (AM)</option>
                        <option value="bahia">Bahia (BA)</option>
                        <option value="ceara">Ceará (CE)</option>
                        <option value="distritoFederal ">Distrito Federal (DF)</option>
                        <option value="espiritoSanto">Espírito Santo (ES)</option>
                        <option value="goiás">Goiás (GO)</option>
                        <option value="maranhao">Maranhão (MA)</option>
                        <option value="MatoGrosso">Mato Grosso (MT)</option>
                        <option value="matoGrossoDoSul">Mato Grosso do Sul (MS)</option>
                        <option value="minasGerais">Minas Gerais (MG)</option>
                        <option value="para">Pará (PA)</option>
                        <option value="paraiba">Paraíba (PB)</option>
                        <option value="paranm">Paraná (PR)</option>
                        <option value="pernambuco">Pernambuco (PE)</option>
                        <option value="piaui">Piauí (PI)</option>
                        <option value="rioDeJaneiro">Rio de Janeiro (RJ)</option>
                        <option value="rioGrandeDoNorte">Rio Grande do Norte (RN)</option>
                        <option value="rioGrandeDoSul">Rio Grande do Sul (RS)</option>
                        <option value="rondonia">Rondônia (RO)</option>
                        <option value="roraima">Roraima (RR)</option>
                        <option value="santaCatarina">Santa Catarina (SC)</option>
                        <option value="saoPaulo">São Paulo (SP)</option>
                        <option value="sergipe">Sergipe (SE)</option>
                        <option value="tocantins">Tocantins (TO)</option>
                    </select>
                    <br>
                    
                    <label for="city">Cidade</label>
                    <input type="text" id="city" name="userCity" required>
                    <br>
                    
                </fieldset>
                <fieldset>
                    <legend>Hábitos</legend>
                    <p>Redes Sociais</p>
                    <input type="checkbox" id="insta" name="social" value="Instagram">
                    <label for="insta">Instagram</label>
                    <br>
                    <input type="checkbox" id="face" name="social" value="Facebook">
                    <label for="face">Facebook</label>
                    <br>
                    <input type="checkbox" id="linke" name="social" value="Linkedin">
                    <label for="linke">Linkedin</label>
                    <br>
                    <input type="checkbox" id="x" name="social" value="X">
                    <label for="x">X</label>
                    <br>
                </fieldset>         

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
</body>
</html>
